name: Release

on:
  push:
    tags:
      - "v*"
  # Re-runnable by hand. Every publishing step in this job is idempotent -- npm
  # skips a version already on the registry, the descriptor publish checks the
  # registry first -- so re-running a release that died halfway is now the
  # supported recovery, instead of finishing it manually step by step.
  #
  # Dispatch against the tag, not a branch: `gh workflow run release.yml --ref vX.Y.Z`.
  # Note this cannot rescue a tag cut before this trigger existed: GitHub reads
  # the trigger list from the file at the dispatched ref, so v0.3.2 and earlier
  # stay un-dispatchable.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # The push trigger could only ever fire on a `v*` tag, so this job used to
      # get its ref shape for free. `workflow_dispatch` accepts any ref, which
      # makes that an assumption rather than a guarantee -- and the steps below
      # publish to npm, to the MCP Registry and cut a GitHub Release before
      # anything would notice the ref was a branch.
      #
      # Deliberately not gated on `github.event_name`: the version half below is
      # what catches a tag that disagrees with package.json, and that failure
      # happened on the push path -- 0.3.1 shipped announcing itself as 0.2.4.
      # A guard that only covers the new path leaves the one the bug used open.
      - name: Refuse to publish from an unreleasable ref
        shell: bash
        run: |
          set -euo pipefail
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Refusing to publish from ${REF_TYPE} '${REF_NAME}'." >&2
            echo "This job publishes to npm and the MCP Registry; only a tag may do that." >&2
            exit 1
          fi

          # This is also the only thing keeping a non-`v*` tag out. `push` filters
          # `tags: v*`; `workflow_dispatch` filters nothing, so a `backup/...` tag
          # would otherwise reach the publish steps.
          if [[ "$REF_NAME" != "v${PKG_VERSION}" ]]; then
            echo "Tag '${REF_NAME}' disagrees with package.json '${PKG_VERSION}'; expected 'v${PKG_VERSION}'." >&2
            echo "Publishing past this is how 0.3.1 shipped announcing itself as 0.2.4." >&2
            exit 1
          fi

          echo "Publishing ${REF_NAME} (package.json ${PKG_VERSION})."
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1: the OIDC
          # token exchange is done by the npm CLI itself. On Node 20 (npm 10.x)
          # `npm publish` never attempts it, falls back to looking for a classic
          # token, finds none and fails with ENEEDAUTH -- which reads like a
          # missing secret rather than a too-old client.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Pinned, not `npm@latest`: this job holds `id-token: write` and can publish
      # the package, so whatever runs in it has to be a version somebody chose.
      # 11.5.1 is the documented minimum for the OIDC exchange; bump deliberately.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:release
      - run: npm test
      - run: npm audit --include=dev --audit-level=moderate
      - run: npm ls @modelcontextprotocol/sdk undici
      - run: npm ls express
      - run: npm ls path-to-regexp
      - run: npm pack --dry-run
      - run: npm pack
      # This step used to echo a message and exit 0 when NPM_TOKEN was empty, so
      # it reported "Verify npm authentication OK" having verified nothing, and
      # the real problem surfaced three steps later with the tarball already
      # built. A check that could not run is not a check that passed, so the
      # OIDC branch now asserts the one precondition that silently breaks it.
      - name: Verify npm authentication
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            npm whoami
            exit 0
          fi

          echo "NPM_TOKEN is not configured; using npm trusted publishing via GitHub OIDC."

          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}, node $(node --version)"

          # Compared with sort -V rather than by fetching a semver package: this
          # step exists to protect the publish, so it must not itself download
          # and execute code inside the job that does the publishing.
          if [[ "$(printf '%s\n%s\n' "$NPM_VERSION" "11.5.1" | sort -V | head -1)" != "11.5.1" ]]; then
            echo "npm ${NPM_VERSION} cannot perform the OIDC exchange; trusted publishing needs >= 11.5.1." >&2
            echo "It would fail at publish time with ENEEDAUTH, which looks like a missing secret." >&2
            exit 1
          fi
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"

          # Makes the job re-runnable. A later step failing used to leave the
          # release half done -- npm published, registry and GitHub Release not
          # -- and re-running died here on "cannot publish over the previously
          # published version", so the only way forward was by hand.
          if npm view "nandi-proxmox-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "nandi-proxmox-mcp@${VERSION} is already on npm; skipping publish."
            exit 0
          fi

          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            npm publish --access public
            exit 0
          fi

          npm publish --access public --provenance
      # The registry is read-after-write eventually consistent. This check used
      # to run within a second of the publish and read the *previous* version,
      # failing a release that had in fact succeeded: v0.3.2 was published at
      # 05:39:27.336Z and this step still saw 0.3.1 at 05:39:28.09.
      - name: Verify published npm version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"

          for attempt in {1..12}; do
            ACTUAL_VERSION="$(npm view nandi-proxmox-mcp version --json 2>/dev/null | tr -d '"' || true)"

            if [[ "$ACTUAL_VERSION" == "$EXPECTED_VERSION" ]]; then
              echo "npm reports ${ACTUAL_VERSION} after ${attempt} attempt(s)."
              exit 0
            fi

            echo "attempt ${attempt}: npm still reports '${ACTUAL_VERSION}', waiting for ${EXPECTED_VERSION}"
            sleep 10
          done

          echo "npm version drift: expected ${EXPECTED_VERSION}, got '${ACTUAL_VERSION}' after 2 minutes" >&2
          exit 1
      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Validate descriptor with mcp-publisher
        run: ./mcp-publisher validate .mcp/server.json
      - name: Publish descriptor with retry
        shell: bash
        env:
          MCP_DESCRIPTOR: .mcp/server.json
        run: |
          set -euo pipefail

          if node scripts/verify-registry-entry.mjs "$MCP_DESCRIPTOR"; then
            echo "Registry already has the expected active latest descriptor; skipping publish."
            exit 0
          fi

          attempt=1
          until ./mcp-publisher publish "$MCP_DESCRIPTOR"; do
            if node scripts/verify-registry-entry.mjs "$MCP_DESCRIPTOR"; then
              echo "Registry converged despite publish error; treating as success."
              exit 0
            fi
            if [[ "$attempt" -ge 3 ]]; then
              echo "mcp-publisher publish failed after ${attempt} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
      - name: Verify registry convergence
        shell: bash
        env:
          MCP_DESCRIPTOR: .mcp/server.json
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if node scripts/verify-registry-entry.mjs "$MCP_DESCRIPTOR"; then
              echo "Registry converged after ${attempt} attempt(s)."
              exit 0
            fi
            echo "attempt ${attempt}: registry has not converged yet, waiting"
            sleep 15
          done

          echo "Registry did not converge to the expected descriptor" >&2
          exit 1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
