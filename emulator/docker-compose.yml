# Proxmox workflow emulator.
#
#   docker compose -f emulator/docker-compose.yml up -d --wait
#
# Models a 3-node cluster:
#   pve-api    stateful fake of the Proxmox REST API (HTTPS, self-signed).
#              Being cluster-wide, it answers for all three nodes, exactly as
#              pveproxy does by forwarding requests to peers.
#   pve-ssh    node pve01, the entry node an operator connects to.
#   pve-ssh-2  node pve02, reachable from pve01 but not published to the host
#              unless EMU_SSH2_PORT is mapped -- so the default topology forces
#              a hop, like a cluster on an internal-only network.
#
# Node pve03 has no container at all: it models a node the operator cannot
# reach by any route, so the failure path is exercised too.
#
# AUTHORIZED_KEY / NODE_PRIVATE_KEY are a throwaway pair generated by the test
# harness. Nothing secret is stored in this file.

name: nandi-proxmox-emulator

services:
  pve-api:
    build:
      context: ./fake-pve
    container_name: nandi-emu-pve-api
    environment:
      PVE_FAKE_USER: "${EMU_PVE_USER:-svc_mcp}"
      PVE_FAKE_REALM: "${EMU_PVE_REALM:-pve}"
      PVE_FAKE_TOKEN_NAME: "${EMU_TOKEN_NAME:-emu}"
      PVE_FAKE_TOKEN_SECRET: "${EMU_TOKEN_SECRET:-emulator-secret-token}"
      PVE_FAKE_TASK_DURATION_MS: "${EMU_TASK_DURATION_MS:-250}"
      PVE_FAKE_MODE: "${EMU_MODE:-cluster}"
      PVE_FAKE_CLUSTER_NAME: "${EMU_CLUSTER_NAME:-emu-cluster}"
      PVE_FAKE_NODE_ADDRESSES: "${EMU_NODE_ADDRESSES:-pve01=pve-ssh,pve02=pve-ssh-2,pve03=pve03.internal.invalid}"
    ports:
      - "${EMU_API_PORT:-18006}:8006"
      - "${EMU_CTRL_PORT:-18765}:8765"
    networks:
      - emu

  pve-ssh:
    build:
      context: ./ssh
    container_name: nandi-emu-pve-ssh
    # Real Proxmox nodes report their node name as the hostname; the setup
    # wizard relies on that to learn which node it is connected to.
    hostname: pve01
    environment:
      AUTHORIZED_KEY: "${AUTHORIZED_KEY:?AUTHORIZED_KEY must be set to a public key}"
      NODE_PRIVATE_KEY: "${NODE_PRIVATE_KEY:-}"
      PVE_FAKE_CONTROL_URL: "http://pve-api:8765"
      PVE_NODE_NAME: "pve01"
    ports:
      - "${EMU_SSH_PORT:-12222}:22"
    depends_on:
      pve-api:
        condition: service_healthy
    networks:
      - emu

  pve-ssh-2:
    build:
      context: ./ssh
    container_name: nandi-emu-pve-ssh-2
    hostname: pve02
    environment:
      AUTHORIZED_KEY: "${AUTHORIZED_KEY:?AUTHORIZED_KEY must be set to a public key}"
      NODE_PRIVATE_KEY: "${NODE_PRIVATE_KEY:-}"
      PVE_FAKE_CONTROL_URL: "http://pve-api:8765"
      PVE_NODE_NAME: "pve02"
    ports:
      # Published so the suite can also prove the direct route via an
      # sshNodes override. Leave unset in a topology test that wants hop-only.
      - "${EMU_SSH2_PORT:-12223}:22"
    depends_on:
      pve-api:
        condition: service_healthy
    networks:
      - emu

networks:
  emu:
    driver: bridge
